# Ambiente local. Em produção, o banco é o Neon (ADR 0003).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: plataforma
    ports:
      - '5432:5432'
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U owner -d plataforma']
      interval: 2s
      timeout: 3s
      retries: 30

  # Captura os e-mails (link mágico e convites) em dev e nos testes. Interface: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
